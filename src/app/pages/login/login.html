<div class="forms">
    <div class="imagem-carro">
        <img src="/img/ranger.png" class="rangerImagem" alt="Ford Ranger">
    </div>

    <div class="painel-login">
        <img src="/img/ford.png" class="logoFord" alt="Ford">

        <div class="fordLogin">
            
            <h2 class="titulo">Boas-Vindas!</h2>
            
            <form #loginForm="ngForm" (ngSubmit)="login()">
                <input type="text" name="nome" [(ngModel)]="usuario.nome"  placeholder="Insira seu nome" class="fordform" required>
                <input type="password" name="senha" [(ngModel)]="usuario.senha" placeholder="Insira sua senha" class="fordform" required>
                <div class="checkbox-container">
                    <input type="checkbox" value="salvarDados" class="checkbox">Logar automaticamente
                </div>
                @if (mensagemDeErro) {
                    <p class="mensagem-erro">{{ mensagemDeErro }}</p>
                }
                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>
</div>
